name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  plugin:
    name: plugin
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: plugin
    steps:
      - uses: actions/checkout@v4
        with:
          path: plugin

      # The SDK is a file: dependency and is not published yet. See docs/development.md.
      - uses: actions/checkout@v4
        with:
          repository: AzPepoze/light-launcher-plugin-sdk
          path: light-launcher-plugin-sdk

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Tests
        run: bun test

      - name: Build Linux
        run: bun run build:linux

      - name: Build Windows
        run: bun run build:windows

      - name: Validate manifest
        run: bun run validate

      - name: Pack smoke test
        run: bun run pack

      - uses: actions/upload-artifact@v4
        if: github.event_name == 'pull_request'
        with:
          name: itch-llplugin
          path: plugin/dist/*.llplugin
          if-no-files-found: error
